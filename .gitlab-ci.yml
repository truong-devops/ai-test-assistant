stages:
  - lint
  - test
  - integration
  - build
  - image
  - security

default:
  interruptible: true
  retry:
    max: 1
    when: [runner_system_failure, stuck_or_timeout_failure]

variables:
  GOFLAGS: "-mod=readonly"
  GOMODCACHE: "$CI_PROJECT_DIR/.cache/go-mod"
  GOCACHE: "$CI_PROJECT_DIR/.cache/go-build"
  npm_config_cache: "$CI_PROJECT_DIR/.cache/npm"

.go-cache: &go-cache
  key: go-$CI_COMMIT_REF_SLUG
  paths: [.cache/go-mod, .cache/go-build]
  policy: pull-push

.node-cache: &node-cache
  key:
    files: [frontend/package-lock.json]
  paths: [.cache/npm]
  policy: pull-push

go-lint:
  stage: lint
  image: golang:1.26.6-alpine
  cache: *go-cache
  script:
    - cd backend && go vet ./...
    - cd ../examples/go-microservices && go vet ./...

frontend-typecheck:
  stage: lint
  image: node:20.19.5-alpine
  cache: *node-cache
  script:
    - cd frontend
    - npm ci --ignore-scripts
    - npm run typecheck

sandbox-policy:
  stage: lint
  image: alpine:3.22
  script:
    - ./scripts/sandbox-security-check.sh

go-unit:
  stage: test
  image: golang:1.26.6
  cache: *go-cache
  script:
    - cd backend && go test -race -count=1 ./...
    - cd ../examples/go-microservices && go test -race -count=1 ./...

frontend-build:
  stage: test
  image: node:20.19.5-alpine
  cache: *node-cache
  script:
    - cd frontend
    - npm ci --ignore-scripts
    - npm run build

.postgres-job: &postgres-job
  image: golang:1.26.6-alpine
  services:
    - name: pgvector/pgvector:pg17
      alias: postgres
  variables:
    POSTGRES_DB: ai_test_assistant_test
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: postgres
    PGPASSWORD: postgres
    TEST_DATABASE_URL: postgres://postgres:postgres@postgres:5432/ai_test_assistant_test?sslmode=disable
  before_script:
    - apk add --no-cache postgresql-client
    - until pg_isready -h postgres -U postgres -d ai_test_assistant_test; do sleep 1; done

postgres-integration:
  <<: *postgres-job
  stage: integration
  cache: *go-cache
  script:
    - for migration in backend/migrations/*.up.sql; do psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f "$migration"; done
    - cd backend
    - go test -count=1 -p 1 -tags=integration ./internal/...

browser-backend:
  stage: test
  image: golang:1.26.6
  cache: *go-cache
  script:
    - mkdir -p dist-browser
    - cd backend
    - CGO_ENABLED=0 go build -o ../dist-browser/api ./cmd/api
    - CGO_ENABLED=0 go build -o ../dist-browser/worker ./cmd/worker
  artifacts:
    paths: [dist-browser/]
    expire_in: 1 day

browser-journeys:
  stage: integration
  image: mcr.microsoft.com/playwright:v1.63.0-noble
  needs: [browser-backend]
  services:
    - name: pgvector/pgvector:pg17
      alias: postgres
  variables:
    POSTGRES_DB: uv09_browser_ci
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: postgres
    UV09_DATABASE_URL: postgres://postgres:postgres@postgres:5432/uv09_browser_ci?sslmode=disable
    UV09_ALLOW_TEST_WRITES: "yes"
    UV09_BIN_DIR: "$CI_PROJECT_DIR/dist-browser"
  cache: *node-cache
  timeout: 20m
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends postgresql-client
    - for attempt in $(seq 1 30); do pg_isready -h postgres -U postgres -d "$POSTGRES_DB" && break; sleep 1; done
    - pg_isready -h postgres -U postgres -d "$POSTGRES_DB"
  script:
    - for migration in backend/migrations/*.up.sql; do psql "$UV09_DATABASE_URL" -v ON_ERROR_STOP=1 -f "$migration"; done
    - npm --prefix frontend ci --ignore-scripts
    - npm --prefix frontend run build
    - npm --prefix frontend run test:e2e
  artifacts:
    when: always
    paths: [frontend/test-results/, frontend/playwright-report/]
    reports:
      junit: frontend/test-results/junit.xml
    expire_in: 14 days

browser-provider-faults:
  extends: browser-journeys
  variables:
    POSTGRES_DB: uv09_provider_ci
    UV09_DATABASE_URL: postgres://postgres:postgres@postgres:5432/uv09_provider_ci?sslmode=disable
    UV09_PROVIDER_FIXTURE: "yes"
  artifacts:
    reports:
      junit: frontend/test-results/provider-faults/junit.xml

# Explicit protected/manual lane. A green deterministic browser job is not proof
# that the deployed Gemini credentials/model work. Requires a protected FILE secret.
provider-real-smoke:
  stage: integration
  image: golang:1.26.6
  cache: *go-cache
  rules:
    - if: '$CI_COMMIT_REF_PROTECTED == "true" && $RUN_REAL_PROVIDER_SMOKE == "yes"'
      when: manual
    - when: never
  allow_failure: false
  timeout: 5m
  script:
    - test -n "$LLM_API_KEY_FILE" && test -n "$LLM_MODEL"
    - cd backend
    - go test -count=1 -v -tags=provider_smoke ./internal/llm -run '^TestGeminiLiveSmoke$'

worker-restart-drill:
  <<: *postgres-job
  stage: integration
  cache: *go-cache
  script:
    - for migration in backend/migrations/*.up.sql; do psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f "$migration"; done
    - mkdir -p test-artifacts
    - cd backend
    - go test -json -count=1 -p 1 -tags=integration ./internal/workflow ./internal/aibudget -run 'TestUV09WorkerSIGKILL|TestExpiredUnknownUsage' > ../test-artifacts/uv09-worker-restart.json
  artifacts:
    when: always
    paths: [test-artifacts/uv09-worker-restart.json]
    expire_in: 14 days

migration-populated:
  <<: *postgres-job
  stage: integration
  script:
    - |
      for migration in backend/migrations/*.up.sql; do
        revision=${migration##*/}
        revision=${revision%%_*}
        if [ "$revision" -gt 23 ]; then break; fi
        psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f "$migration"
      done
    - psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f scripts/uv09-legacy-fixture.sql
    - |
      for migration in backend/migrations/*.up.sql; do
        revision=${migration##*/}
        revision=${revision%%_*}
        if [ "$revision" -le 23 ]; then continue; fi
        psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f "$migration"
      done
    - psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f scripts/uv09-migration-assertions.sql

migration-roundtrip:
  <<: *postgres-job
  stage: integration
  script:
    - for migration in backend/migrations/*.up.sql; do psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f "$migration"; done
    - for migration in $(find backend/migrations -name '*.down.sql' | sort -r); do psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f "$migration"; done
    - for migration in backend/migrations/*.up.sql; do psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f "$migration"; done

backend-build:
  stage: build
  image: golang:1.26.6-alpine
  cache: *go-cache
  script:
    - mkdir -p dist
    - cd backend
    - CGO_ENABLED=0 go build -trimpath -o ../dist/api ./cmd/api
    - CGO_ENABLED=0 go build -trimpath -o ../dist/worker ./cmd/worker
    - CGO_ENABLED=0 go build -trimpath -o ../dist/evaluate ./cmd/evaluate
    - CGO_ENABLED=0 go build -trimpath -o ../dist/healthcheck ./cmd/healthcheck
  artifacts:
    paths: [dist/]
    expire_in: 7 days

image-build:
  stage: image
  image: docker:28.3.3-cli
  services:
    - name: docker:28.3.3-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  script:
    - docker build --build-arg BUILD_VERSION="$CI_COMMIT_REF_SLUG" --build-arg VCS_REF="$CI_COMMIT_SHA" -f infra/docker/Dockerfile.api -t ai-test-assistant-api:ci .
    - docker build --build-arg BUILD_VERSION="$CI_COMMIT_REF_SLUG" --build-arg VCS_REF="$CI_COMMIT_SHA" -f infra/docker/Dockerfile.worker -t ai-test-assistant-worker:ci .
    - docker build --build-arg BUILD_VERSION="$CI_COMMIT_REF_SLUG" --build-arg VCS_REF="$CI_COMMIT_SHA" -f infra/docker/Dockerfile.frontend -t ai-test-assistant-frontend:ci .
    - docker build --build-arg BUILD_VERSION="$CI_COMMIT_REF_SLUG" --build-arg VCS_REF="$CI_COMMIT_SHA" -f infra/docker/Dockerfile.sandbox -t ai-test-assistant-sandbox:ci .
    - docker image inspect ai-test-assistant-api:ci ai-test-assistant-worker:ci ai-test-assistant-frontend:ci ai-test-assistant-sandbox:ci >/dev/null

dependency-audit:
  stage: security
  image: node:20.19.5-alpine
  cache: *node-cache
  script:
    - cd frontend
    - npm ci --ignore-scripts
    - npm audit --audit-level=high

sandbox-runtime:
  stage: security
  image: golang:1.26.6-alpine
  services:
    - name: docker:28.3.3-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    SANDBOX_IMAGE: ai-test-assistant-sandbox:ci
  before_script:
    - apk add --no-cache docker-cli
  script:
    - docker build -f infra/docker/Dockerfile.sandbox -t "$SANDBOX_IMAGE" .
    - ./scripts/sandbox-security-check.sh
    - ./scripts/sandbox-smoke.sh
    - cd backend
    - RUN_SANDBOX_TESTS=1 SANDBOX_TEST_IMAGE="$SANDBOX_IMAGE" go test -count=1 -tags=sandbox ./internal/validation ./internal/repair
