services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ai_test_assistant
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_test_assistant"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - postgres_data:/var/lib/postgresql/data

  migrate:
    image: migrate/migrate:v4.18.3
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../../backend/migrations:/migrations:ro
    command:
      - -path=/migrations
      - -database=postgres://postgres:postgres@postgres:5432/ai_test_assistant?sslmode=disable
      - up

  migrate-down:
    image: migrate/migrate:v4.18.3
    profiles: ["tools"]
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../../backend/migrations:/migrations:ro
    command:
      - -path=/migrations
      - -database=postgres://postgres:postgres@postgres:5432/ai_test_assistant?sslmode=disable
      - down
      - "1"

  api:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api
    environment:
      APP_ENV: development
      HTTP_ADDR: :8080
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/ai_test_assistant?sslmode=disable
      DATABASE_MAX_CONNS: 10
      SHUTDOWN_TIMEOUT: 10s
      GITLAB_WEBHOOK_SECRET: ${GITLAB_WEBHOOK_SECRET:-dev-webhook-secret}
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
    restart: unless-stopped

  worker:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.worker
    environment:
      APP_ENV: development
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/ai_test_assistant?sslmode=disable
      DATABASE_MAX_CONNS: 10
      GITLAB_BASE_URL: ${GITLAB_BASE_URL:-https://gitlab.com}
      GITLAB_TOKEN: ${GITLAB_TOKEN:-}
      GITLAB_REQUEST_TIMEOUT: 15s
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-local}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-hash-v1}
      LLM_PROVIDER: ${LLM_PROVIDER:-disabled}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_REQUEST_TIMEOUT: ${LLM_REQUEST_TIMEOUT:-60s}
      LLM_MAX_OUTPUT_TOKENS: ${LLM_MAX_OUTPUT_TOKENS:-6000}
      WORKER_POLL_INTERVAL: 2s
      WORKER_RETRY_DELAY: 5s
      WORKER_LEASE_DURATION: 5m
      WORKER_MAX_ATTEMPTS: 3
      SANDBOX_IMAGE: ${SANDBOX_IMAGE:-ai-test-assistant-sandbox:phase7}
      SANDBOX_TIMEOUT_SECONDS: ${SANDBOX_TIMEOUT_SECONDS:-60}
      SANDBOX_MEMORY_MB: ${SANDBOX_MEMORY_MB:-512}
      SANDBOX_CPU_LIMIT: ${SANDBOX_CPU_LIMIT:-1.0}
      SANDBOX_PIDS_LIMIT: ${SANDBOX_PIDS_LIMIT:-128}
      MAX_REPAIR_ATTEMPTS: ${MAX_REPAIR_ATTEMPTS:-2}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  sandbox:
    image: ${SANDBOX_IMAGE:-ai-test-assistant-sandbox:phase7}
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.sandbox
    profiles: ["tools"]

volumes:
  postgres_data:
